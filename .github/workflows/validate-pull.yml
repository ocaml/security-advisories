name: validate_advisory

on: [pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ocaml-version: ["4.14.4"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Use OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}

      - name: Install advisories
        run: opam pin add --confirm-level=unsafe-yes https://github.com/hannesm/advisories.git

      - name: Use Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install osv-linter
        run: |
          git clone --depth 1 -b linter-opam https://github.com/bn-d/osv-schema.git /tmp/osv-schema
          cd /tmp/osv-schema/tools/osv-linter
          go build -o "$(go env GOPATH)/bin/osv" ./cmd/osv

      - name: Check and run advisories
        run: |
          git fetch origin ${{ github.base_ref }}
          opam repository add main git+https://github.com/ocaml/opam-repository.git
          opam repository add archive git+https://github.com/ocaml/opam-repository-archive.git
          RC=0
          for x in $(find advisories/ -type f -size +0 | sort); do
            echo "Converting advisory $x"
            opam exec -- advisories $x > $x.json
            echo "Advisory is:"
            cat $x.json | jq
            echo "Validating advisory $x.json"
            osv record lint --collection ALL $x.json || RC=1
          done
          exit $RC
