name: validate_advisory

on: [pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ocaml-version: ["4.14.4"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Use OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}

      - name: Install advisories
        run: opam pin add --confirm-level=unsafe-yes https://github.com/hannesm/advisories.git

      - name: Use Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install osv-linter
        run: go install github.com/ossf/osv-schema/tools/osv-linter/cmd/osv@latest

      - name: Check and run advisories
        run: |
          git fetch origin ${{ github.base_ref }}
          opam repository add main git+https://github.com/ocaml/opam-repository.git
          opam repository add archive git+https://github.com/ocaml/opam-repository-archive.git
          CHANGED_FILES=$(git diff --name-only -r HEAD^1 HEAD | grep advisories || :)
          for x in $CHANGED_FILES; do
            if [ -e "${x}" -a ! -s "${x}" ]; then echo "Skipping reserved advisory ${x}"; continue; fi
            echo "Converting advisory $x"
            opam exec -- advisories $x > $x.json
            echo "Advisory is:"
            cat $x.json | jq
            echo "Validating advisory $x.json"
            osv record lint --collection offline $x.json
            echo "Done with exit code $?"
          done
